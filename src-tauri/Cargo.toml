[package]
name = "farthing"
version = "0.2.0"
description = "Zero-config macOS menu bar app for Claude Code token/cost usage"
authors = ["Pat Eason"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "farthing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: menu bar status item (tray.rs, task 4.1).
# Pinned to ~2.11: the stacked menu-bar readout (tray_render.rs) reaches the
# native NSStatusItem via `with_inner_tray_icon`, whose inner `tray-icon` type
# can change across Tauri minor releases.
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Native save dialog for the report-export destination (export.rs); scoped to
# the save dialog in capabilities (dialog:allow-save), not the broader default.
tauri-plugin-dialog = "2"
# Report-export bundle assembly (export.rs): writes report.html + the two CSVs
# into a single .zip. Minimal feature set — deflate is the only codec needed.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Positions the popover window under the tray icon (multi-monitor and
# scale-factor aware); fed by forwarding tray events in tray.rs.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# Login-item registration. macOS launcher mode is LaunchAgent (per PRD):
# enable() writes ~/Library/LaunchAgents/<app>.plist, disable() removes it.
tauri-plugin-autostart = "2"
# Native desktop notifications (notify.rs): permission-gated cost alerts.
# Driven from Rust via NotificationExt; display-only (no click/action
# handlers — those are mobile-only in Tauri 2). Desktop sound landed in
# 2.3.1, so pin "2.3".
tauri-plugin-notification = "2.3"
serde = { version = "1", features = ["derive"] }
# preserve_order: the settings.json merge engine (settings_merge.rs) rewrites
# the user's ~/.claude/settings.json and must keep their key order stable so
# rewrites produce minimal, reviewable diffs.
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "time"] }
# Pricing-table remote refresh (pricing.rs): one GET against the pinned
# LiteLLM price-list URL at app start. rustls so the binary doesn't depend
# on the system TLS stack; already in the dependency tree via tauri.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Line diff for the onboarding before/after settings.json preview.
similar = "2"
# Local-midnight day boundaries for the popover metrics (metrics.rs): the
# PRD defines "today" as the user's local calendar day, DST-correct.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Stacked menu-bar budget readout (tray_render.rs): drawn natively because the
# layout (large centered cost + full-height pipe + two stacked rows with
# trailing stoplight dots) can't be expressed through Tauri's plain set_title.
# Reaches the NSStatusItem button via `with_inner_tray_icon` and draws an
# NSImage. objc2* are already transitive via tauri/tray-icon; pinned to the
# in-tree versions and declared directly here for the AppKit/Foundation APIs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = [
    "NSString",
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSData",
] }
objc2-app-kit = { version = "=0.3.2", features = [
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSColor",
    "NSFont",
    "NSParagraphStyle",
    "NSStringDrawing",
    "NSBezierPath",
    "NSGraphicsContext",
    "NSGraphics",
    "NSApplication",
    "NSAppearance",
    "NSAttributedString",
] }


[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
# MockRuntime for exercising plugin-backed commands (autostart) in unit tests.
tauri = { version = "2", features = ["test"] }
