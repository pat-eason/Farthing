name: Release

# Tag-driven release pipeline: pushing a `v*` tag builds a universal macOS
# .dmg, signs and notarizes it when the Apple secrets are configured (see
# docs/release.md), and publishes a GitHub Release with the artifacts.
#
# Signing/notarization is OPTIONAL and gated on repo secrets so that forks
# (and this repo before credentials exist) still get a working pipeline:
#   - no secrets        -> unsigned .dmg, release is created as a DRAFT
#   - signing secrets   -> Developer ID signed .dmg
#   - + notary secrets  -> notarized + stapled, Gatekeeper-verified, published
#
# Three ways in:
#   - push a `v*` tag             -> builds and publishes that tag
#   - workflow_call (tag input)   -> the Version workflow calls this after a
#                                    "Version Packages" PR merges; this job
#                                    creates and pushes the tag, then publishes
#   - workflow_dispatch           -> build-only dry run, no tag, no release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to create, build, and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    env:
      # Secrets are not allowed in step `if:` expressions, so surface their
      # presence as job-level env flags. All-or-nothing per group.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # Resolve the release tag and mode once: a `workflow_call` passes the tag
      # as an input (the tag does not exist in git yet — we create it below);
      # a tag push carries it on the ref; a manual dispatch has neither and is
      # treated as a build-only dry run. `github.event_name` is unreliable here
      # (a called workflow reports the caller's event), so key off inputs.tag
      # and ref_type instead.
      - name: Resolve release tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=call" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=tag" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=dispatch" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        if: env.RELEASE_TAG != ''
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - name: Report signing configuration
        run: |
          echo "Signing secrets present:      $HAS_SIGNING"
          echo "Notarization secrets present: $HAS_NOTARY"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY not configured; building an UNSIGNED .dmg and publishing as a draft. See docs/release.md."
          elif [ "$HAS_NOTARY" != "true" ]; then
            echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not configured; the build will be signed but NOT notarized. See docs/release.md."
          fi

      # Tauri's bundler picks up the APPLE_* env vars natively: it imports the
      # certificate into a temporary keychain, signs with the hardened runtime,
      # and (when the notary vars are present) submits to Apple's notary
      # service and staples the ticket. No extra tooling needed.
      - name: Build universal .dmg (signed & notarized)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build universal .dmg (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify code signature
        if: env.HAS_SIGNING == 'true'
        run: |
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          echo "Verifying: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify notarization (Gatekeeper assessment)
        if: env.HAS_NOTARY == 'true'
        run: |
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=2 "$APP"

      - name: Collect artifacts
        id: artifacts
        run: |
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg produced by the bundler"
            exit 1
          fi
          STABLE_DMG="$(dirname "$DMG")/Farthing.dmg"
          cp "$DMG" "$STABLE_DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "stable_dmg=$STABLE_DMG" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DMG" "$STABLE_DMG" | tee checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.dmg_name }}
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            checksums.txt
          if-no-files-found: error

      # In call mode the tag does not exist yet: create it on the built commit
      # and push it now so `gh release create --verify-tag` can find it. Pushing
      # with GITHUB_TOKEN does not re-trigger the `push: tags` event (GitHub's
      # anti-recursion rule), which is exactly what we want here.
      - name: Create and push tag
        if: env.RELEASE_MODE == 'call'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists; skipping create"
          else
            git tag "$RELEASE_TAG"
          fi
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          {
            # Extract this version's section from CHANGELOG.md
            awk "/^## $TAG_VERSION\$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md \
              | sed '/^[[:space:]]*$/d; $d' \
              | sed 's/^[[:space:]]*//'
            echo
            echo "---"
            echo
            echo "## Install"
            echo
            echo "Download the .dmg below, open it, and drag the app to /Applications."
            echo
            if [ "$HAS_NOTARY" = "true" ]; then
              echo "This build is Developer ID signed and notarized by Apple (Gatekeeper-verified in CI)."
            elif [ "$HAS_SIGNING" = "true" ]; then
              echo "> [!WARNING]"
              echo "> This build is signed but **not notarized**; Gatekeeper will warn on first launch."
            else
              echo "> [!WARNING]"
              echo "> This build is **unsigned** (built without Apple credentials); macOS will refuse to open it without right-click > Open. Do not ship this to users."
            fi
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } > release-notes.md

          DRAFT_FLAG=""
          if [ "$HAS_NOTARY" != "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --notes-file release-notes.md \
            $DRAFT_FLAG \
            "$DMG" "${{ steps.artifacts.outputs.stable_dmg }}" checksums.txt

  release-linux:
    name: Build and publish Linux artifacts (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    # The macOS `release` job creates the GitHub Release (and, in call mode, the
    # tag). This job only uploads to it, so it must run AFTER the macOS job.
    needs: release
    steps:
      - uses: actions/checkout@v4

      # Mirror the macOS job's tag resolution exactly so this job agrees on the
      # tag and skips cleanly in dispatch (dry-run) mode where no release exists.
      - name: Resolve release tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=call" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=tag" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=dispatch" >> "$GITHUB_ENV"
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        if: env.RELEASE_TAG != ''
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - name: Build Linux bundles (deb, rpm, AppImage)
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect Linux artifacts
        id: artifacts
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle
          DEB="$(find "$BUNDLE_DIR/deb"      -maxdepth 1 -name '*.deb'      -print -quit)"
          RPM="$(find "$BUNDLE_DIR/rpm"      -maxdepth 1 -name '*.rpm'      -print -quit)"
          APPIMAGE="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          for f in "$DEB" "$RPM" "$APPIMAGE"; do
            if [ -z "$f" ]; then
              echo "::error::A Linux artifact was not produced (deb='$DEB' rpm='$RPM' appimage='$APPIMAGE')"
              exit 1
            fi
          done
          echo "deb=$DEB"           >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM"           >> "$GITHUB_OUTPUT"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DEB" "$RPM" "$APPIMAGE" | tee checksums-linux.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: farthing-linux-bundles
          path: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.rpm }}
            ${{ steps.artifacts.outputs.appimage }}
            checksums-linux.txt
          if-no-files-found: error

      # Upload to the release the macOS job already created. --clobber makes this
      # idempotent on re-runs. We do NOT create the release or the tag here.
      - name: Upload Linux artifacts to the GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "${{ steps.artifacts.outputs.deb }}" \
            "${{ steps.artifacts.outputs.rpm }}" \
            "${{ steps.artifacts.outputs.appimage }}" \
            checksums-linux.txt
