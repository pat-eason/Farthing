name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Svelte check
        run: pnpm check

  rust:
    name: Rust (fmt, clippy, build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (required by tauri-build)
        run: pnpm build

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        run: pnpm tauri build --bundles app

  rust-linux:
    name: Rust (Linux — fmt, clippy, test, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (required by tauri-build)
        run: pnpm build

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (deb, rpm, AppImage)
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Verify Linux artifacts were produced
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle
          DEB="$(find "$BUNDLE_DIR/deb"      -maxdepth 1 -name '*.deb'      -print -quit 2>/dev/null || true)"
          RPM="$(find "$BUNDLE_DIR/rpm"      -maxdepth 1 -name '*.rpm'      -print -quit 2>/dev/null || true)"
          APPIMAGE="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' -print -quit 2>/dev/null || true)"
          echo "deb:      ${DEB:-<missing>}"
          echo "rpm:      ${RPM:-<missing>}"
          echo "AppImage: ${APPIMAGE:-<missing>}"
          MISSING=0
          [ -n "$DEB" ]      || { echo "::error::No .deb produced";      MISSING=1; }
          [ -n "$RPM" ]      || { echo "::error::No .rpm produced";      MISSING=1; }
          [ -n "$APPIMAGE" ] || { echo "::error::No .AppImage produced"; MISSING=1; }
          [ "$MISSING" = "0" ] || exit 1
