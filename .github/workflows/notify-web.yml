name: Notify marketing site

# When a GitHub Release is published, tell the farthing-web marketing site
# (pat-eason/farthing-web) about the new version via a repository_dispatch.
# That repo's update-version workflow writes the version into its source and
# redeploys. Keyed on `release: published` (not the tag push) so DRAFT releases
# — the unsigned / not-notarized path in release.yml — do not update the site
# until they are actually published.
#
# GITHUB_TOKEN cannot dispatch across repos, so this uses FARTHING_WEB_DISPATCH_TOKEN,
# a fine-grained PAT scoped to pat-eason/farthing-web with Contents: read & write.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch version to farthing-web
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.FARTHING_WEB_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::FARTHING_WEB_DISPATCH_TOKEN not set; skipping marketing-site notification."
            exit 0
          fi
          gh api -X POST repos/pat-eason/farthing-web/dispatches \
            --input - <<EOF
          {"event_type":"farthing-release","client_payload":{"version":"${TAG}"}}
          EOF
          echo "Dispatched farthing-release for ${TAG} to pat-eason/farthing-web."
